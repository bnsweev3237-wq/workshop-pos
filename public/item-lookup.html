<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craftium — Item lookup</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#c1623d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body { background: var(--bg); }
  .lookup-wrap { max-width: 420px; margin: 0 auto; padding: 40px 16px 60px; text-align: center; }
  .lookup-logo { height: 40px; margin-bottom: 28px; }
  .lookup-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 20px; box-shadow: var(--shadow); }
  .lookup-photo { width: 100%; max-width: 260px; border-radius: 10px; margin: 0 auto 18px; display: block; }
  .lookup-name { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  .lookup-price { font-size: 28px; font-weight: 700; color: var(--accent); }
  .lookup-empty, .lookup-error { color: var(--muted); padding: 10px 0; }
</style>
</head>
<body>

<div class="lookup-wrap">
  <img class="lookup-logo" src="/img/craftium-logo.png" alt="Craftium">
  <div class="lookup-card" id="lookupCard">
    <p class="lookup-empty" id="lookupLoading">Looking that up…</p>
  </div>
</div>

<script src="/item-lookup.js"></script>
</body>
</html>
